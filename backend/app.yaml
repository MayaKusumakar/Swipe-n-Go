runtime: python313
entrypoint: gunicorn -b :$PORT main:app

# Stay inside the App Engine free tier (28 F1 instance-hours a day): one F1
# instance at most is 24 hours a day. Under heavy load the app gets slower
# instead of starting a second, billable instance.
instance_class: F1
automatic_scaling:
  min_instances: 0
  max_instances: 1

env_variables:
  # Google sign-in: the iOS OAuth client ID (not a secret). Required: without it every
  # /api request answers 401. infra/deploy.sh refuses to deploy the placeholder.
  GOOGLE_CLIENT_IDS: "429318024050-quhgg4irk5561gsv0kkosg6d9jft13bt.apps.googleusercontent.com"
  # AI features on. The Claude key comes from Secret Manager (services/api_keys.py),
  # never from this file. The planner and flyer reader need only the key.
  AI_SUMMARIES: "on"
  # "Describe your plan" in Host a plan (POST /api/experimental/events/parse).
  EXPERIMENTS: "event_parse"
  # No DATASTORE_NAMESPACE: the live app uses the default namespace, which has no seeded
  # sample events (2026-11-25). scripts/seed_dev_events.py writes only to "dev".

# HTTPS only: plain http:// redirects to https://, so a sign-in token is never sent unencrypted.
handlers:
- url: /.*
  script: auto
  secure: always
