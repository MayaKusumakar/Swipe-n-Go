org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official

# Backend the app talks to. For a local backend, run once per emulator/device
# session:  adb reverse tcp:8080 tcp:8080
# so the device's localhost:8080 tunnels to your computer. (Android 17 blocks
# apps targeting SDK 37 from private IPs like 10.0.2.2 without a runtime
# permission; loopback isn't affected.) Override per build without editing:
#   ./gradlew installDebug -PswipeNGo.apiBaseUrl=https://<project-id>.appspot.com
swipeNGo.apiBaseUrl=http://localhost:8080
